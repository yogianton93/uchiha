name: Verify Human Identity

on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: 'uchiha93'
        required: true
        default: 'uchiha93'
      agent_description:
        description: 'uchiha93'
        required: true
        default: 'uchiha93 AI Agent'

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Step 1 - Install ClawHub skill
        run: npx clawhub@latest install verified-agent-identity

      - name: Install script dependencies
        run: |
          cd scripts
          npm install

      - name: Step 2 - Create new Ethereum Identity
        run: node scripts/createNewEthereumIdentity.js

      - name: Step 3 - Link Human to Agent
        run: |
          node scripts/manualLinkHumanToAgent.js --challenge '{"name": "uchiha93", "description": "uchiha93 AI Agent"}'
